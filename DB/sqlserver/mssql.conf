# General settings
[sqlserver]
# Default trace enabled
default trace enabled = 1

# Memory configuration
memory_limit_mb = 4096

# File stream settings
filestream access level = 2

# Query performance tuning
query governor cost limit = 0
max server memory = 4096
min server memory = 2048

# Connections
user connections = 150

# TempDB optimization
tempdb size = 2
tempdb filegrowth = 64
tempdb maxsize = 1024
