#
# MECZY Monitoring Stack
#

networks:
  monitoring-network:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /etc/prometheus:/etc/prometheus
      - /prometheus:/prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Meczy@2024
    volumes:
      - /var/lib/grafana:/var/lib/grafana
    networks:
      - monitoring-network
    restart: unless-stopped

  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    ports:
      - "9116:9116"  # Expose SNMP Exporter port
    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml  # Configuration for SNMP exporter
    networks:
      - monitoring-network
    restart: unless-stopped
  
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"  # Access Uptime Kuma on port 3001
    volumes:
      - /var/lib/uptime-kuma:/app/data  # Persist data across restarts
    networks:
      - monitoring-network
    restart: unless-stopped
